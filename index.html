<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>vinovim</title>
<meta name="theme-color" content="#09080d">
<meta name="description" content="vinovim — o teu hub de filmes e séries">
<script>
// No browser normal, o site abre a página de downloads; as apps instaladas abrem o vinovim
(function () { try {
  if (/[?&]web\b/.test(location.search)) localStorage.setItem('vinovim.web', '1');
  var ua = navigator.userAgent;
  var isApp = window.vinovimNative || window.Capacitor || /Electron|; wv\)/.test(ua) || navigator.standalone ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || localStorage.getItem('vinovim.web');
  if (!isApp && /^https?:$/.test(location.protocol)) location.replace('/download');
} catch (e) {} })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="vinovim">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09080d;--bg2:#100e16;--card:#191621;--card2:#211d2b;--line:#2b2636;
  --tx:#f4f0f8;--mu:#a39cb1;--mu2:#6f687c;
  --ac:#e0315b;--ac2:#f5c26b;--acs:rgba(224,49,91,.16);
  --r:14px;--side:84px;
  --fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
img{display:block}
a{color:inherit}
::selection{background:var(--ac);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2533;border-radius:10px;border:3px solid var(--bg)}
.hidden{display:none!important}

/* ---------- side nav ---------- */
#nav{position:fixed;inset:0 auto 0 0;width:var(--side);background:linear-gradient(180deg,#0e0c13,#09080d);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px;z-index:40}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:18px;text-decoration:none}
.brand svg{width:40px;height:40px}
.brand span{font-family:var(--fd);font-weight:800;font-size:12px;letter-spacing:.02em;color:var(--mu)}
.nv{width:62px;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu2);font-size:10.5px;font-weight:600;transition:.18s;text-decoration:none;position:relative}
.nv svg{width:22px;height:22px}
.nv:hover{color:var(--tx);background:var(--card)}
.nv.on{color:var(--tx);background:var(--acs)}
.nv.on::before{content:"";position:absolute;left:-11px;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--ac)}
.nv.on svg{color:var(--ac)}
.nvsp{flex:1}

main{margin-left:var(--side);min-height:100vh;padding-bottom:60px}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding:28px 40px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:16px 40px;background:linear-gradient(180deg,rgba(9,8,13,.92),rgba(9,8,13,0));backdrop-filter:blur(0px)}
.topbar.solid{background:rgba(9,8,13,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar h1{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:-.02em}
.tsp{flex:1}
.qbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:var(--mu);font-size:13.5px;transition:.2s;text-decoration:none}
.qbtn:hover{background:rgba(255,255,255,.12);color:var(--tx)}
.qbtn svg{width:17px;height:17px}
.home .topbar{position:absolute;left:var(--side);right:0;top:0}

/* ---------- hero ---------- */
.hero{position:relative;height:min(78vh,760px);min-height:520px;overflow:hidden}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transition:opacity .8s ease, transform 8s ease;transform:scale(1.04)}
.hbg.show{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,8,13,.96) 0%,rgba(9,8,13,.7) 38%,rgba(9,8,13,0) 70%),linear-gradient(0deg,var(--bg) 2%,rgba(9,8,13,0) 45%)}
.hcon{position:absolute;z-index:2;left:40px;bottom:80px;max-width:560px}
.hkick{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac2);margin-bottom:16px}
.hkick i{width:22px;height:2px;background:var(--ac2);display:block}
.hlogo{max-width:420px;max-height:150px;object-fit:contain;object-position:left bottom;margin-bottom:18px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5))}
.htitle{font-family:var(--fd);font-size:clamp(38px,5vw,64px);line-height:.95;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
.hmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--mu);font-size:13.5px;margin-bottom:14px}
.rate{display:inline-flex;align-items:center;gap:5px;color:var(--ac2);font-weight:700}
.hdesc{color:#d4cedc;line-height:1.55;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:24px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14.5px;transition:.18s;white-space:nowrap}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--tx);color:#0b0a10}
.btn.pri:hover{background:#fff;transform:translateY(-1px)}
.btn.acc{background:var(--ac);color:#fff}
.btn.acc:hover{filter:brightness(1.1)}
.btn.gho{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.btn.gho:hover{background:rgba(255,255,255,.18)}
.btn.ico{width:48px;padding:0;justify-content:center}
.btn.sm{height:38px;padding:0 16px;font-size:13px}
.btn.on{background:var(--acs);border-color:var(--ac);color:#ff9fb6}
.hdots{position:absolute;z-index:3;right:40px;bottom:84px;display:flex;gap:8px}
.hdots button{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.3);transition:.3s}
.hdots button.on{width:28px;background:var(--ac)}

/* ---------- rows ---------- */
.rows{position:relative;z-index:3;margin-top:-30px}
.row{margin:0 0 34px}
.rowh{display:flex;align-items:flex-end;gap:12px;padding:0 40px;margin-bottom:12px}
.rowh h2{font-family:var(--fd);font-size:21px;font-weight:700;letter-spacing:-.01em}
.rowh small{color:var(--mu2);font-size:12.5px;padding-bottom:3px}
.rowh .tsp{flex:1}
.arr{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mu);transition:.15s}
.arr:hover{color:var(--tx);border-color:var(--mu2)}
.arr svg{width:16px;height:16px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:6px 40px 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.track::-webkit-scrollbar{display:none}

.card{flex:0 0 auto;width:158px;text-align:left;scroll-snap-align:start;border-radius:var(--r);transition:transform .2s ease}
.pimg{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,var(--card2),var(--card));box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.pimg .ptitle{position:absolute;inset:auto 10px 12px;font-family:var(--fd);font-weight:700;font-size:15px;line-height:1.1;display:none}
.pimg.noimg img{display:none}.pimg.noimg .ptitle{display:block}
.card:hover .pimg img{transform:scale(1.06)}
.card:hover .pimg{box-shadow:0 0 0 2px var(--ac),0 14px 34px rgba(0,0,0,.5)}
.card:focus-visible{outline:none}.card:focus-visible .pimg{box-shadow:0 0 0 3px var(--ac2)}
.cinfo{padding:9px 2px 0}
.cinfo span{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cinfo small{color:var(--mu2);font-size:12px}
.badge{position:absolute;top:8px;left:8px;background:rgba(9,8,13,.78);backdrop-filter:blur(6px);border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;color:var(--ac2)}
.bar{position:absolute;left:10px;right:10px;bottom:10px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ac)}
.card.wide{width:300px}
.card.wide .pimg{aspect-ratio:16/9}
.card.wide .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0) 60%)}
.card.wide .wt{position:absolute;left:12px;right:12px;bottom:22px;font-weight:700;font-size:14px}
.card.wide .wt small{display:block;color:var(--mu);font-weight:500;font-size:12px;margin-top:2px}
.card.wide .play{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.92);color:#000;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:.2s}
.card.wide:hover .play{opacity:1;transform:none}
.card.wide .play svg{width:22px;height:22px;margin-left:3px}
.rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;opacity:0;transition:.2s}
.card:hover .rm{opacity:1}.rm svg{width:14px;height:14px}

.sk{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- grid / chips ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.grid .card{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{height:36px;padding:0 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mu);font-size:13px;font-weight:600;transition:.15s}
.chip:hover{color:var(--tx);border-color:var(--mu2)}
.chip.on{background:var(--tx);color:#0b0a10;border-color:var(--tx)}
.more{display:flex;justify-content:center;margin-top:30px}
.empty{padding:70px 20px;text-align:center;color:var(--mu)}
.empty svg{width:54px;height:54px;color:var(--mu2);margin-bottom:14px}
.empty h3{font-family:var(--fd);font-size:22px;color:var(--tx);margin-bottom:6px}
.empty p{max-width:440px;margin:0 auto 18px;line-height:1.5}

/* ---------- search ---------- */
.sbox{position:relative;max-width:760px;margin-bottom:26px}
.sbox svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--mu2)}
.sbox input{width:100%;height:62px;border-radius:20px;background:var(--card);border:1px solid var(--line);padding:0 20px 0 56px;font-size:18px;outline:none;transition:.2s}
.sbox input:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.sec{font-family:var(--fd);font-size:19px;font-weight:700;margin:6px 0 14px}

/* ---------- detail ---------- */
#detail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none}
#detail.open{display:block;animation:fade .3s ease}
.dbg{position:fixed;inset:0;background-size:cover;background-position:center top;opacity:.55}
.dbg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 8%,rgba(9,8,13,.55) 55%,rgba(9,8,13,.25)),linear-gradient(0deg,var(--bg) 10%,rgba(9,8,13,0) 70%)}
.dwrap{position:relative;z-index:2;padding:26px 56px 80px;max-width:1500px}
.dtop{display:flex;justify-content:space-between;margin-bottom:9vh}
.dmain{display:grid;grid-template-columns:1fr 300px;gap:50px;align-items:end}
.dlogo{max-width:460px;max-height:160px;object-fit:contain;object-position:left bottom;margin-bottom:20px}
.dtitle{font-family:var(--fd);font-size:clamp(36px,5vw,66px);font-weight:800;line-height:.95;letter-spacing:-.03em;margin-bottom:18px}
.dmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pill{height:28px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#ddd6e5}
.pill.g{color:var(--ac2)}
.ddesc{max-width:680px;line-height:1.65;color:#d8d2e0;font-size:15.5px;margin-bottom:24px}
.dcrew{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;color:var(--mu);max-width:680px;margin-bottom:26px}
.dcrew b{color:var(--mu2);font-weight:600}
.dposter{width:100%;aspect-ratio:2/3;border-radius:20px;object-fit:cover;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.dsec{margin-top:56px}
.stabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scrollbar-width:none}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.ep{display:flex;gap:14px;text-align:left;padding:10px;border-radius:16px;background:rgba(25,22,33,.7);border:1px solid var(--line);transition:.15s;backdrop-filter:blur(6px)}
.ep:hover{border-color:var(--ac);background:var(--card2)}
.eth{position:relative;flex:0 0 150px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--card2)}
.eth img{width:100%;height:100%;object-fit:cover}
.eth .bar{left:6px;right:6px;bottom:6px;height:3px}
.eth .w{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.eth .w svg{width:13px;height:13px}
.etx{min-width:0;padding-top:2px}
.etx b{display:block;font-size:14px;margin-bottom:3px}
.etx small{display:block;color:var(--mu2);font-size:12px;margin-bottom:6px}
.etx p{color:var(--mu);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- streams drawer ---------- */
#drawer{position:fixed;inset:0;z-index:70;display:none}
#drawer.open{display:block}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);animation:fade .2s}
.dpanel{position:absolute;right:0;top:0;bottom:0;width:min(480px,100%);background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.dph{padding:22px 22px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dph h3{font-family:var(--fd);font-size:20px;line-height:1.15}
.dph small{color:var(--mu);font-size:13px}
.dpb{flex:1;overflow-y:auto;padding:16px 18px 30px}
.sgrp{margin-bottom:20px}
.sgrp h4{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu2);margin:0 4px 10px}
.sgrp h4 img{width:18px;height:18px;border-radius:5px}
.st{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;transition:.15s}
.st:hover{border-color:var(--ac);background:var(--card2)}
.st[disabled]{opacity:.45;cursor:not-allowed}
.st .si{flex:0 0 38px;height:38px;border-radius:10px;background:var(--acs);color:var(--ac);display:grid;place-items:center}
.st .si svg{width:18px;height:18px}
.st b{display:block;font-size:13.5px;margin-bottom:2px}
.st span{display:block;font-size:12px;color:var(--mu);white-space:pre-line;line-height:1.4}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.note{padding:14px;border-radius:14px;background:var(--card);border:1px dashed var(--line);color:var(--mu);font-size:13px;line-height:1.5;margin-bottom:12px}

/* ---------- player ---------- */
#player{position:fixed;inset:0;z-index:90;background:#000;display:none}
#player.open{display:block}
#vid{width:100%;height:100%;object-fit:contain;background:#000}
#vid::cue{background:rgba(0,0,0,.6);font-family:var(--fb);font-size:clamp(16px,2.4vw,28px)}
#yt{position:absolute;inset:0;display:none}
#yt iframe{width:100%;height:100%;border:0}
.pui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .3s;pointer-events:none}
.pui>*{pointer-events:auto}
#player.idle .pui{opacity:0;cursor:none}
#player.idle{cursor:none}
.ptop{display:flex;align-items:center;gap:16px;padding:22px 28px 60px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
.ptop b{display:block;font-family:var(--fd);font-size:20px}
.ptop small{color:#bbb;font-size:13px}
.pb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:.15s;flex:0 0 auto}
.pb:hover{background:rgba(255,255,255,.14)}
.pb svg{width:22px;height:22px}
.pmid{flex:1;display:grid;place-items:center;pointer-events:none}
.pmid .spin{width:54px;height:54px;border-width:4px}
.pbot{padding:60px 28px 22px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.seek{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;margin-bottom:8px}
.seek .tr{position:absolute;left:0;right:0;height:4px;border-radius:4px;background:rgba(255,255,255,.22);transition:height .15s}
.seek:hover .tr{height:6px}
.seek .bf{position:absolute;left:0;height:100%;background:rgba(255,255,255,.3);border-radius:4px}
.seek .pg{position:absolute;left:0;height:100%;background:var(--ac);border-radius:4px}
.seek .kn{position:absolute;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(224,49,91,.4);transform:scale(0);transition:transform .15s}
.seek:hover .kn{transform:scale(1)}
.seek .tip{position:absolute;bottom:22px;transform:translateX(-50%);background:#000c;padding:3px 8px;border-radius:6px;font-size:12px;display:none}
.seek:hover .tip{display:block}
.pctl{display:flex;align-items:center;gap:4px}
.ptime{font-size:13.5px;color:#ddd;font-variant-numeric:tabular-nums;margin-left:8px}
.pctl .tsp{flex:1}
.vol{width:90px;accent-color:var(--ac)}
.pmenu{position:absolute;right:28px;bottom:86px;min-width:230px;max-height:50vh;overflow:auto;background:rgba(16,14,22,.96);border:1px solid var(--line);border-radius:16px;padding:8px;display:none}
.pmenu.open{display:block}
.pmenu h5{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu2);padding:8px 10px 6px}
.pmenu button{display:flex;width:100%;padding:9px 10px;border-radius:9px;font-size:13.5px;text-align:left;gap:8px}
.pmenu button:hover{background:var(--card2)}
.pmenu button.on{color:var(--ac2)}
.pmenu button.on::after{content:"✓";margin-left:auto}
.perr{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px}
.perr.show{display:grid}
.perr div{max-width:440px}
.perr h3{font-family:var(--fd);font-size:24px;margin-bottom:8px}
.perr p{color:#bbb;margin-bottom:18px;line-height:1.5}
.nextup{position:absolute;right:28px;bottom:110px;background:rgba(16,14,22,.94);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:none;align-items:center;gap:14px}
.nextup.show{display:flex}
.nextup small{display:block;color:var(--mu);font-size:12px}

/* ---------- addons / settings ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}
.panel h3{font-family:var(--fd);font-size:18px;margin-bottom:4px}
.panel p.m{color:var(--mu);font-size:13.5px;line-height:1.5;margin-bottom:16px}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.inp{flex:1;min-width:220px;height:46px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);padding:0 16px;outline:none;font-size:14px}
.inp:focus{border-color:var(--ac)}
.adn{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);margin-bottom:10px}
.adn .lg{flex:0 0 52px;height:52px;border-radius:14px;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-family:var(--fd);font-weight:800;font-size:20px;color:var(--ac)}
.adn .lg img{width:100%;height:100%;object-fit:cover}
.adn .tx{flex:1;min-width:0}
.adn b{display:block;font-size:15px}
.adn small{display:block;color:var(--mu2);font-size:12px;margin:2px 0 6px}
.adn p{color:var(--mu);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--mu)}
.tag.s{background:var(--acs);color:#ff9fb6}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;transition:.15s}
.sw.on{border-color:#fff}
.legal{color:var(--mu2);font-size:12.5px;line-height:1.6;max-width:760px}

html.amoled{--bg:#000;--bg2:#060509;--card:#0f0e14;--card2:#17151d;--line:#221f2a}
.tg{flex:0 0 46px;width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ac)}.tg.on::after{left:23px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .tx{flex:1;min-width:0}.srow b{display:block;font-size:14px;font-weight:600}.srow small{color:var(--mu2);font-size:12px}
.srow .arr{width:30px;height:30px}
.sel{height:38px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);padding:0 10px;outline:none}
.mk{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;opacity:0;transition:.15s;font-size:12px}
.ep:hover .mk{opacity:1}.mk.on{background:var(--ac);opacity:1}
.flush .rowh,.flush .track{padding-left:0;padding-right:0}
.seg{display:none;gap:6px}
.seg a{height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);display:inline-flex;align-items:center;font-size:13px;font-weight:600;text-decoration:none;backdrop-filter:blur(8px)}
.mbrand{display:none;align-items:center;gap:8px;font-family:var(--fd);font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.mbrand svg{width:28px;height:28px}

#upd{position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:20px;background:rgba(5,4,8,.72);backdrop-filter:blur(10px)}
#upd.open{display:grid;animation:fade .25s}
.ucard{position:relative;width:min(460px,100%);border-radius:28px;background:linear-gradient(180deg,#17141f,#0e0c13);border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 120px rgba(0,0,0,.6);overflow:hidden;animation:pop .45s cubic-bezier(.2,.9,.25,1.2)}
@keyframes pop{from{transform:translateY(24px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.uglow{position:absolute;left:-20%;right:-20%;top:-140px;height:280px;background:radial-gradient(closest-side,var(--ac),transparent);opacity:.45;filter:blur(30px);pointer-events:none}
.uhead{position:relative;padding:34px 30px 8px;text-align:center}
.uhead svg{width:72px;height:72px;filter:drop-shadow(0 12px 30px rgba(224,49,91,.45));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.uhead h2{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:-.02em;margin:16px 0 10px}
.uver{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:700;color:var(--mu)}
.uver b{color:var(--ac2)}
.ulist{position:relative;list-style:none;padding:20px 30px 6px;display:grid;gap:11px}
.ulist li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45;color:#ddd6e5}
.ulist li i{flex:0 0 22px;height:22px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.ubtns{position:relative;display:flex;gap:10px;padding:22px 30px 28px}
.ubtns .btn{flex:1;justify-content:center}
.uprog{height:4px;margin:6px 30px 0;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;display:none}
.uprog b{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:load 1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(330%)}}

.hist{margin-bottom:28px;max-width:760px}
.histh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.histh .sec{margin:0}
.hlist{display:grid;gap:2px}
.hitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:#ddd6e5;transition:.15s}
.hitem:hover{background:var(--card)}
.hitem>svg{width:18px;height:18px;color:var(--mu2);flex:0 0 auto}
.hitem span{flex:1;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mu2);opacity:0;transition:.15s;flex:0 0 auto}
.hitem:hover button{opacity:1}.hitem button:hover{background:var(--card2);color:var(--tx)}
.hitem button svg{width:14px;height:14px}
@media (hover:none){.hitem button{opacity:1}}
.sbox .sclr{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;display:none;place-items:center;color:var(--mu)}
.sbox .sclr.show{display:grid}.sbox .sclr:hover{background:var(--card2);color:var(--tx)}
.sbox .sclr svg{position:static;transform:none;width:16px;height:16px;color:currentColor}
.sbox input{padding-right:60px}

/* perfis */
.pav{display:inline-grid;place-items:center;border-radius:28%;background:linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--pc) 55%,#000));color:#fff;font-family:var(--fd);font-weight:800;flex:0 0 auto;transition:.2s}
.pav svg{width:40%;height:40%}
#profiles{position:fixed;inset:0;z-index:110;background:radial-gradient(800px 500px at 50% 0,rgba(224,49,91,.18),transparent 60%),var(--bg);display:none;place-items:center;padding:24px;overflow:auto}
#profiles.open{display:grid;animation:fade .3s}
.pwrap{text-align:center;max-width:900px}
.pwrap h2{font-family:var(--fd);font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.02em;margin-bottom:34px}
.plist{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-bottom:38px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--mu);padding:8px;border-radius:24px;outline:none}
.pcard:hover,.pcard:focus{color:var(--tx)}
.pcard:hover .pav,.pcard:focus .pav{box-shadow:0 0 0 3px #fff;transform:scale(1.05)}
.pcard.on .pav{box-shadow:0 0 0 3px var(--ac)}
.pcard b{font-size:16px;font-weight:600}
.pcard small{font-size:12px;color:var(--mu2);margin-top:-8px}
.pact{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pedit{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:30px}
.pedit .inp{width:320px;max-width:100%;flex:none;text-align:center;font-size:18px}
.nv.prof{height:auto;padding:8px 0;gap:6px;margin-top:6px}
.nv.prof span:last-child{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plinks{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.plinks .pcard{flex-direction:row;padding:6px 12px 6px 6px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);gap:10px}
.plinks .pcard b{font-size:14px}
/* elenco e avaliações */
.castt{gap:18px}
.person{flex:0 0 auto;width:112px;text-align:center;outline:none}
.person .ph{position:relative;display:block;width:96px;height:96px;margin:0 auto 10px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--card2),var(--card));box-shadow:0 0 0 1px var(--line);transition:.2s}
.person .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.person .ph i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-weight:800;font-size:26px;color:var(--mu)}
.person:hover .ph,.person:focus .ph{box-shadow:0 0 0 3px var(--ac);transform:scale(1.04)}
.person b{display:block;font-size:13px;line-height:1.25}
.person small{display:block;color:var(--mu2);font-size:12px;margin-top:3px;line-height:1.3}
.rinfo{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:14px 0 20px}
.rate-card{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--ac2) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:20px}
.rate-card b{display:block;font-size:15px}.rate-card small{color:var(--mu2);font-size:12px}
.rate-link{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:13.5px;text-decoration:none;padding:9px 14px;border:1px solid var(--line);border-radius:999px}
.rate-link svg{width:14px;height:14px}.rate-link:hover{color:var(--tx)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.facts div{padding:14px 16px;border-radius:14px;background:rgba(25,22,33,.7);border:1px solid var(--line)}
.facts small{display:block;color:var(--mu2);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.facts b{font-size:14px;font-weight:600;line-height:1.4}
/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg2{display:inline-flex;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);transition:.2s}
.seg2 button{height:34px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mu)}
.seg2 button.on{background:var(--tx);color:#0b0a10}
.seg2.dim{opacity:.45}
.filters .sel{height:44px;border-radius:999px;padding:0 16px;background:var(--card)}
.grid .empty{grid-column:1/-1}
/* legendas */
.pmenu .prow{display:flex;gap:6px;padding:2px 8px 8px;flex-wrap:wrap}
.pmenu .prow button{width:auto;padding:7px 12px;border-radius:999px;background:var(--card2);font-size:12.5px}
.pmenu .prow button.on{background:var(--tx);color:#0b0a10}
.pmenu .prow button.on::after{content:none}
.pmenu .phint{display:block;color:var(--mu2);font-size:11.5px;padding:0 10px 6px}
#player.drop::after{content:"Larga aqui a legenda (.srt/.vtt) ou o vídeo";position:absolute;inset:20px;border:3px dashed var(--ac);border-radius:24px;display:grid;place-items:center;font-family:var(--fd);font-size:26px;font-weight:800;background:rgba(9,8,13,.75);pointer-events:none;z-index:5}
.subprev{height:120px;border-radius:14px;margin:4px 0 8px;display:grid;place-items:end center;padding-bottom:18px;background:linear-gradient(135deg,#3a2a40,#141019 60%,#2a1d18)}
#subPrev{padding:2px 8px;border-radius:4px;font-family:var(--fb)}
/* TV */
html.tv{font-size:17px}
html.tv button,html.tv a,html.tv select,html.tv input,html.tv [tabindex]{outline:none}
html.tv button:focus,html.tv a:focus,html.tv select:focus,html.tv input:focus,html.tv [tabindex]:focus{box-shadow:0 0 0 3px #fff}
html.tv .card:focus{box-shadow:none;z-index:2}
html.tv .card:focus .pimg{box-shadow:0 0 0 4px #fff,0 18px 40px rgba(0,0,0,.6);transform:scale(1.06)}
html.tv .card:focus .cinfo span{color:#fff}
html.tv .nv:focus{background:var(--acs);color:var(--tx);box-shadow:inset 0 0 0 2px #fff}
html.tv .person:focus,html.tv .pcard:focus{box-shadow:none}
html.tv .card{width:180px}html.tv .card.wide{width:330px}
html.tv .pad,html.tv .rowh,html.tv .track{padding-left:56px;padding-right:56px}
html.tv .track{padding-top:14px;padding-bottom:22px}
html.tv .arr{display:none}
html.tv .hitem:focus{background:var(--card)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:100;background:var(--tx);color:#0b0a10;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:.3s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- mobile ---------- */
@media (max-width:820px){
  :root{--side:0px}
  .seg,.mbrand{display:flex}
  .topbar .qbtn span,.topbar a.qbtn{display:none}
  .topbar{padding-top:calc(14px + env(safe-area-inset-top))}
  .ptop{padding-top:calc(16px + env(safe-area-inset-top))}
  .pbot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .dpanel{padding-bottom:env(safe-area-inset-bottom)}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  #nav{inset:auto 0 0 0;width:auto;height:calc(66px + env(safe-area-inset-bottom));flex-direction:row;justify-content:space-around;padding:0 6px env(safe-area-inset-bottom);border-right:0;border-top:1px solid var(--line);background:rgba(12,10,16,.94);backdrop-filter:blur(14px)}
  .brand,.nvsp,.nv.dk{display:none}
  .nv{width:auto;flex:1;height:56px}
  .nv.on::before{left:30%;right:30%;top:-5px;bottom:auto;height:3px;width:auto}
  main{padding-bottom:90px}
  .pad,.topbar{padding-left:18px;padding-right:18px}
  .home .topbar{left:0}
  .hero{height:72vh;min-height:480px}
  .hero::after{background:linear-gradient(0deg,var(--bg) 8%,rgba(9,8,13,.55) 55%,rgba(9,8,13,.2))}
  .hcon{left:18px;right:18px;bottom:60px}
  .hdots{right:18px;bottom:28px}
  .rowh,.track{padding-left:18px;padding-right:18px}
  .card{width:124px}.card.wide{width:240px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 12px}
  .dwrap{padding:18px 18px 100px}
  .dmain{grid-template-columns:1fr}
  .dposter{display:none}
  .eps{grid-template-columns:1fr}
  .eth{flex-basis:120px}
  .vol{display:none}
  .ptop,.pbot{padding-left:14px;padding-right:14px}
}
</style>

    <div class="ptop"><button class="pb" id="pBack" aria-label="Voltar"></button><div style="min-width:0"><b id="pTitle"></b><small id="pSub"></small></div></div>
    <div class="pmid" id="pMid"></div>

      <div class="seek" id="pSeek"><div class="tr"><div class="bf" id="pBuf"></div><div class="pg" id="pProg"></div></div><div class="kn" id="pKnob"></div><div class="tip" id="pTip">0:00</div></div>

const ACCENTS = [['#e0315b','#f5c26b'],['#7c5cff','#5ce1e6'],['#16c784','#d4f55c'],['#ff7a1a','#ffd25c'],['#2f8cff','#9ed0ff'],['#ff4fd8','#ffb86b']];

const NATIVE = window.vinovimNative || null;
const CHANGELOG = ["Ao abrir: primeiro a logo, depois “Quem está a ver?” com os teus perfis (sem nada a aparecer antes)", "“Mais bem avaliados” em Filmes e Séries agora ordena mesmo pela nota, do melhor para o pior (também por ano e género)", "Novo visual organizado como a Netflix: menu no topo, menu “Mais” e definições por separadores", "Abertura animada com o “ta-dum” do vinovim", "Trailer a tocar no destaque do início e pré-visualização ao passar o rato pelos cartões", "“% para ti”: quanto cada título combina contigo", "Filas “Porque viste…”, Top 10 de filmes e séries e filas para o teu momento do dia", "“Continuar a ver” com a imagem da cena onde paraste", "No fim de um filme, 3 sugestões parecidas com contagem", "Novo separador “Novidades” com as estreias e o botão “Avisa-me”"];

/* ---------- icons ---------- */
const sv = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {

  dice:sv('<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>'),
  search:sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  star:'<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="m12 2 3 6.6 7 .7-5.3 4.7 1.6 7L12 17.4 5.7 21l1.6-7L2 9.3l7-.7z"/></svg>',
  puzzle:sv('<path d="M10 3h4v3a2 2 0 1 0 4 0V3h3v7h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H3v-7h3a2 2 0 1 0 0-4H3V3z"/>'),
  book:sv('<path d="M6 3h12v18l-6-4-6 4z"/>'),
  trash:sv('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  wifi:sv('<path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/>')
};

/* ---------- state ---------- */
const KEY = 'vinovim.v1';
const S = (() => {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const o = Object.assign({ addons: [], library: {}, progress: {}, watched: {}, accent: 0, volume: 1, cats: { order: [], on: {} } }, d);
  o.prefs = Object.assign({ sortQ: true, autoplay: false, hideTorrent: true, subLang: 'pt', amoled: false, rpc: true, rpcPrivate: false, subSize: 'm', subColor: '#ffffff', subBg: 'semi' }, d.prefs || {});
  return o;
})();
const SUBLANGS = { off: ['Desligadas', []], pt: ['Português (PT)', ['por', 'pt', 'pt-pt', 'portuguese']], br: ['Português (BR)', ['pob', 'pt-br', 'ptbr', 'brazilian']], en: ['Inglês', ['eng', 'en', 'english']], es: ['Espanhol', ['spa', 'es', 'spanish']], fr: ['Francês', ['fre', 'fra', 'fr', 'french']] };
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
/* cada perfil tem a sua lista, progresso, vistos e histórico */
const PCOLORS = ['#e0315b', '#7c5cff', '#16c784', '#ff7a1a', '#2f8cff', '#ff4fd8', '#f5c26b', '#5ce1e6'];
const PKEYS = ['library', 'progress', 'watched', 'searchHistory'];
const emptyPData = () => ({ library: {}, progress: {}, watched: {}, searchHistory: [] });
(function migrateProfiles() {
  if (!Array.isArray(S.profiles) || !S.profiles.length) { S.profiles = [{ id: 'p1', name: 'Eu', color: 0 }]; S.activeProfile = 'p1'; }
  S.pdata = S.pdata || {};
  S.profiles.forEach(p => { S.pdata[p.id] = Object.assign(emptyPData(), S.pdata[p.id] || {}); });
  const first = S.pdata[S.profiles[0].id];
  PKEYS.forEach(k => { if (Object.prototype.hasOwnProperty.call(S, k)) { const v = S[k]; delete S[k]; if (v && (Array.isArray(v) ? v.length : Object.keys(v).length)) first[k] = v; } });
  if (!S.pdata[S.activeProfile]) S.activeProfile = S.profiles[0].id;
  PKEYS.forEach(k => Object.defineProperty(S, k, { enumerable: false, configurable: true, get() { return S.pdata[S.activeProfile][k]; }, set(v) { S.pdata[S.activeProfile][k] = v; } }));
})();

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ITEMS = new Map();
const remember = it => { if (it && it.id) ITEMS.set(it.id, Object.assign(ITEMS.get(it.id) || {}, it)); return it; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400); }
function fmt(s) { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function applyAccent() { const [a, b] = ACCENTS[S.accent] || ACCENTS[0]; const r = document.documentElement.style; r.setProperty('--ac', a); r.setProperty('--ac2', b); r.setProperty('--acs', a + '29'); document.documentElement.classList.toggle('amoled', !!S.prefs.amoled); if (typeof applyTV === 'function') applyTV(); }

/* ---------- addons (protocolo Stremio) ---------- */
const normUrl = u => u.trim().replace(/^stremio:\/\//i, 'https://');
const baseOf = u => normUrl(u).replace(/\/manifest\.json(\?.*)?$/i, '');
const cache = new Map();
function getJSON(u) {
  if (!cache.has(u)) cache.set(u, fetch(u).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).catch(e => { cache.delete(u); throw e; }));
  return cache.get(u);
}
const ADDONS = [];   // {url, base, m}
async function loadAddons() {
  const urls = [CINEMETA, ...S.addons.filter(u => u !== CINEMETA)];
  const res = await Promise.allSettled(urls.map(u => getJSON(normUrl(u))));
  ADDONS.length = 0;
  res.forEach((r, i) => { if (r.status === 'fulfilled') ADDONS.push({ url: urls[i], base: baseOf(urls[i]), m: r.value }); });
  if (!ADDONS.length) throw new Error('offline');
}
function supports(m, res, type, id) {
  for (const r of m.resources || []) {
    const name = typeof r === 'string' ? r : r.name;
    if (name !== res) continue;
    const types = (typeof r === 'object' && r.types) || m.types || [];
    const pref = (typeof r === 'object' && r.idPrefixes) || m.idPrefixes;
    if (type && types.length && !types.includes(type)) continue;
    if (id && pref && pref.length && !pref.some(p => id.startsWith(p))) continue;
    return true;
  }
  return false;
}
const extraStr = ex => { const p = Object.entries(ex || {}).filter(([, v]) => v !== undefined && v !== '').map(([k, v]) => `${k}=${encodeURIComponent(v)}`); return p.length ? '/' + p.join('&') : ''; };
async function catalog(a, type, id, extra) {
  const d = await getJSON(`${a.base}/catalog/${type}/${id}${extraStr(extra)}.json`);
  return (d.metas || []).map(x => remember({ ...x, type: x.type || type }));
}
const cinemeta = () => ADDONS.find(a => a.url === CINEMETA) || ADDONS[0];
async function getMeta(type, id) {
  const list = ADDONS.filter(a => supports(a.m, 'meta', type, id));
  list.sort((a, b) => (a.url === CINEMETA) - (b.url === CINEMETA)); // addons específicos primeiro
  for (const a of list.length ? list : [cinemeta()]) {
    try { const d = await getJSON(`${a.base}/meta/${type}/${encodeURIComponent(id)}.json`); if (d.meta) return remember({ ...d.meta, type: d.meta.type || type }); } catch (e) {}
  }
  throw new Error('Sem metadados');
}

/* ---------- biblioteca & progresso ---------- */
const slim = m => ({ id: m.id, type: m.type, name: m.name, poster: m.poster, background: m.background, releaseInfo: m.releaseInfo, imdbRating: m.imdbRating });
const inLib = id => !!S.library[id];
function toggleLib(m) {
  if (inLib(m.id)) { delete S.library[m.id]; toast('Removido da tua lista'); }
  else { S.library[m.id] = { ...slim(m), added: Date.now() }; toast('Adicionado à tua lista'); }
  save();
}
function progressFor(videoId) { for (const p of Object.values(S.progress)) if (p.videoId === videoId) return p; return null; }

/* ---------- UI helpers ---------- */
function card(it) {
  remember(it);
  const year = (it.releaseInfo || '').toString().slice(0, 9);
  return `<button class="card" data-open="${esc(it.type)}|${esc(it.id)}" title="${esc(it.name)}">
    <div class="pimg"><img loading="lazy" src="${esc(it.poster || IMG.poster(it.id))}" alt="" onerror="window.vvPoster?vvPoster(this):this.parentNode.classList.add('noimg')"><span class="ptitle">${esc(it.name)}</span>${it.imdbRating ? `<span class="badge">★ ${esc(it.imdbRating)}</span>` : ''}</div>
    <div class="cinfo"><span>${esc(it.name)}</span><small>${esc(year)}${it.type === 'series' ? ' · Série' : ''}</small></div></button>`;
}
function wideCard(p) {
  const pct = p.d ? Math.min(100, p.t / p.d * 100) : 0;
  return `<button class="card wide" data-resume="${esc(p.id)}">
    <div class="pimg"><img loading="lazy" src="${esc(p.thumb || p.background || IMG.bg(p.id))}" alt="" onerror="this.src='${esc(p.poster || '')}'"><div class="ov"></div><span class="play">${I.play}</span>
    <span class="rm" data-unprog="${esc(p.id)}" title="Remover">${I.x}</span>
    <div class="wt">${esc(p.name)}<small>${p.ep ? esc(p.ep) + ' · ' : ''}faltam ${fmt(p.d - p.t)}</small></div><i class="bar"><b style="width:${pct}%"></b></i></div></button>`;
}
function rowHTML(title, inner, sub = '') {
  return `<section class="row"><div class="rowh"><h2>${esc(title)}</h2>${sub ? `<small>${esc(sub)}</small>` : ''}<div class="tsp"></div><button class="arr" data-scroll="-1">${I.left}</button><button class="arr" data-scroll="1">${I.right}</button></div><div class="track">${inner}</div></section>`;
}
const skRow = (n = 8) => rowHTML('…', Array.from({ length: n }, () => `<div class="card"><div class="pimg sk"></div><div class="cinfo"><span class="sk" style="height:12px;border-radius:6px;width:80%">&nbsp;</span></div></div>`).join(''));
function emptyHTML(icon, t, p, btn = '') { return `<div class="empty">${icon}<h3>${t}</h3><p>${p}</p>${btn}</div>`; }
function offlineHTML() { return emptyHTML(I.wifi, 'Sem ligação aos addons', 'Não foi possível contactar o catálogo. Verifica a tua ligação à internet e tenta outra vez.', '<button class="btn pri" onclick="boot()">Tentar de novo</button>'); }
const LOGO = '<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="url(#lg)"/><path d="M14 13 L24 35 L34 13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="13" r="3" fill="#fff"/></svg>';
const topbar = (title, solid = true, home = false) => `<div class="topbar ${solid ? 'solid' : ''}">${home ? `<a class="mbrand" href="#home">${LOGO}vinovim</a>` : ''}${title ? `<h1>${title}</h1>` : ''}<div class="tsp"></div>${home ? '<nav class="seg"><a href="#movies">Filmes</a><a href="#series">Séries</a></nav>' : ''}<button class="qbtn" data-surprise>${I.dice}<span>Surpreende-me</span></button><a class="qbtn" href="#search">${I.search}<span>Pesquisar</span></a></div>`;

/* ---------- views ---------- */
const app = $('#app');
let heroTimer;
const VIEWS = {
  async home() {
    app.className = 'home';
    app.innerHTML = `<div class="view">${topbar('', false, true)}<div class="hero" id="hero"><div class="hbg sk"></div></div><div class="rows" id="rows">${skRow()}${skRow()}</div></div>`;
    const cm = cinemeta();

      .catch(() => $('#hc' + i)?.remove()));
  },
  movies() { return browse('movie', 'Filmes'); },
  series() { return browse('series', 'Séries'); },
  search() {
    app.className = '';

    let t; q.addEventListener('input', () => { clr.classList.toggle('show', !!q.value); clearTimeout(t); t = setTimeout(() => doSearch(q.value), 350); });
    q.addEventListener('keydown', e => {
      if (e.key === 'Enter') { clearTimeout(t); addHistory(q.value); doSearch(q.value); q.blur(); }
      if (e.key === 'Escape' && q.value) { e.stopPropagation(); q.value = ''; clr.classList.remove('show'); doSearch(''); }
    });
    clr.onclick = () => { q.value = ''; clr.classList.remove('show'); doSearch(''); q.focus(); };
    showSearchHints();

  },
  library() {

      ${lib.length ? `<div class="chips" id="lchips"><button class="chip on" data-lf="all">Tudo (${lib.length})</button><button class="chip" data-lf="movie">Filmes</button><button class="chip" data-lf="series">Séries</button></div><div class="grid" id="lgrid">${lib.map(card).join('')}</div>`
      : emptyHTML(I.book, 'A tua lista está vazia', 'Carrega no botão + em qualquer filme ou série para o guardar aqui.', '<a class="btn pri" href="#home">Explorar</a>')}
    </div></div>`;
    $('#lchips')?.addEventListener('click', e => {
      const b = e.target.closest('[data-lf]'); if (!b) return;

    });
  },
  addons() {

    app.innerHTML = `<div class="view">${topbar('Addons')}<div class="pad" style="max-width:980px">
      <div class="panel"><h3>Instalar addon</h3><p class="m">O vinovim usa o protocolo de addons do Stremio. Cola o link do <b>manifest.json</b> de um addon (catálogos, metadados, fontes ou legendas). Links <code>stremio://</code> também funcionam.</p>
      <form class="inrow" id="addF"><input class="inp" id="addU" placeholder="https://exemplo.com/manifest.json" required><button class="btn acc">${I.plus}Instalar</button></form></div>
      <h3 class="sec">Instalados</h3><div id="alist">${ADDONS.map(addonRow).join('')}</div>
      <p class="legal" style="margin-top:20px">O vinovim não aloja, guarda nem distribui conteúdo. Tudo o que aparece vem dos addons que instalas, e és responsável por usar apenas fontes a que tenhas direito de aceder.</p>
    </div></div>`;
    $('#addF').addEventListener('submit', async e => {
      e.preventDefault();
      const u = normUrl($('#addU').value);

      try {
        const m = await getJSON(u);
        if (!m.id || !m.resources) throw new Error();
        S.addons.push(u); save(); ADDONS.push({ url: u, base: baseOf(u), m });
        toast(`${m.name || 'Addon'} instalado`); VIEWS.addons();
      } catch (err) { toast('Não foi possível ler esse manifest'); }
    });
  },
  settings() {

/* catálogos do início (configuráveis) */
const DEFAULT_ON = ['cm|movie|top', 'cm|series|top', 'cm|movie|imdbRating', 'cm|movie|top|Animation', 'cm|movie|top|Comedy', 'cm|movie|top|Horror', 'cm|movie|top|Sci-Fi'];
function allCats() {
  const cm = cinemeta(), L = [];
  if (cm) {
    L.push({ key: 'cm|movie|top', name: 'Filmes em alta', sub: 'Cinemeta', a: cm, type: 'movie', id: 'top' });
    L.push({ key: 'cm|series|top', name: 'Séries em alta', sub: 'Cinemeta', a: cm, type: 'series', id: 'top' });
    L.push({ key: 'cm|movie|imdbRating', name: 'Filmes mais bem avaliados', sub: 'Cinemeta', a: cm, type: 'movie', id: 'imdbRating' });
    L.push({ key: 'cm|series|imdbRating', name: 'Séries mais bem avaliadas', sub: 'Cinemeta', a: cm, type: 'series', id: 'imdbRating' });
    GENRES.forEach(([g, p]) => L.push({ key: 'cm|movie|top|' + g, name: p, sub: 'Filmes', a: cm, type: 'movie', id: 'top', extra: { genre: g } }));
    GENRES.forEach(([g, p]) => L.push({ key: 'cm|series|top|' + g, name: p, sub: 'Séries', a: cm, type: 'series', id: 'top', extra: { genre: g } }));
  }
  ADDONS.filter(a => a.url !== CINEMETA).forEach(a => (a.m.catalogs || []).forEach(c => {
    if ((c.extra || []).some(e => e.isRequired) || (c.extraRequired || []).length) return;
    L.push({ key: a.url + '|' + c.type + '|' + c.id, name: c.name || c.id, sub: a.m.name, a, type: c.type, id: c.id });
  }));
  return L;
}
function homeCats() {
  const all = allCats(), cfg = S.cats;
  const isOn = c => c.key in cfg.on ? cfg.on[c.key] : (DEFAULT_ON.includes(c.key) || !c.key.startsWith('cm|'));
  const ord = c => { const i = cfg.order.indexOf(c.key); return i < 0 ? 1000 + all.indexOf(c) : i; };
  return all.map(c => ({ ...c, on: isOn(c) })).sort((x, y) => ord(x) - ord(y));
}
function catListHTML() {
  const L = homeCats();
  return L.map((c, i) => `<div class="srow"><div class="tx"><b>${esc(c.name)}</b><small>${esc(c.sub)}</small></div>
    <button class="arr" data-catmv="${i}|-1" ${i ? '' : 'disabled'} title="Subir">${sv('<path d="m6 15 6-6 6 6"/>')}</button>
    <button class="arr" data-catmv="${i}|1" ${i < L.length - 1 ? '' : 'disabled'} title="Descer">${sv('<path d="m6 9 6 6 6-6"/>')}</button>
    <button class="tg ${c.on ? 'on' : ''}" data-cattg="${esc(c.key)}" aria-label="Mostrar no início"></button></div>`).join('');
}

/* browse */
async function browse(type, title) {
  app.className = '';
  const st = Object.assign({ genre: '', year: '', sort: 'top', min: 0 }, (VIEWS._bf || {})[type] || {}, { items: [], done: false, skip: 0 });
  const thisYear = new Date().getFullYear(), years = Array.from({ length: thisYear - 1949 }, (_, i) => thisYear - i);
  app.innerHTML = `<div class="view">${topbar(title)}<div class="pad">
    <div class="filters">
      <div class="seg2" id="fsort"><button data-sort="top">Populares</button><button data-sort="imdbRating">Mais bem avaliados</button></div>
      <select class="sel" id="fyear"><option value="">Todos os anos</option>${years.map(y => `<option>${y}</option>`).join('')}</select>
      <select class="sel" id="fmin"><option value="0">Qualquer avaliação</option><option value="6">★ 6 ou mais</option><option value="7">★ 7 ou mais</option><option value="8">★ 8 ou mais</option></select>
      <button class="btn sm gho" id="freset">Limpar filtros</button>
    </div>
    <div class="chips" id="gch"><button class="chip" data-g="">Todos os géneros</button>${GENRES.map(([g, p]) => `<button class="chip" data-g="${g}">${p}</button>`).join('')}</div>
    <div class="grid" id="bgrid"></div><div class="more"><button class="btn gho" id="bmore">Carregar mais</button></div></div></div>`;
  const grid = $('#bgrid'), more = $('#bmore');
  const sync = () => {
    [...$('#fsort').children].forEach(x => x.classList.toggle('on', x.dataset.sort === st.sort));
    [...$('#gch').children].forEach(x => x.classList.toggle('on', x.dataset.g === st.genre));
    $('#fyear').value = st.year; $('#fmin').value = String(st.min);
    VIEWS._bf = Object.assign(VIEWS._bf || {}, { [type]: { genre: st.genre, year: st.year, sort: st.sort, min: st.min } });
  };
  const pass = m => (!st.min || parseFloat(m.imdbRating) >= st.min) && (!st.year || !st.genre || (m.genres || []).includes(st.genre));
  let seq = 0;
  const rated = async () => {
    const k = 'vv_rated|' + type + '|' + (st.year || '') + '|' + (st.genre || '');
    try { const c = JSON.parse(sessionStorage.getItem(k) || 'null'); if (c && c.length) return c; } catch (e) {}
    const cm = cinemeta(), jobs = [];
    for (let s = 0; s < (st.year ? 400 : 600); s += 50) jobs.push(st.year ? catalog(cm, type, 'year', { genre: st.year, skip: s || undefined }).catch(() => []) : catalog(cm, type, 'top', { genre: st.genre || undefined, skip: s || undefined }).catch(() => []));
    const seen = new Set(), out = [];
    (await Promise.all(jobs)).flat().forEach(m => { const r = parseFloat(m && m.imdbRating); if (m && m.id && r > 0 && !seen.has(m.id)) { seen.add(m.id); out.push({ id: m.id, type: m.type || type, name: m.name, poster: m.poster, background: m.background, releaseInfo: m.releaseInfo, imdbRating: m.imdbRating, genres: m.genres || [] }); } });
    out.sort((a, b) => parseFloat(b.imdbRating) - parseFloat(a.imdbRating) || String(a.name).localeCompare(String(b.name)));
    try { if (out.length) sessionStorage.setItem(k, JSON.stringify(out)); } catch (e) {}
    return out;
  };
  const load = async (reset) => {
    const my = reset ? ++seq : seq;
    if (reset) { st.items = []; st.skip = 0; st.done = false; st.pool = null; grid.innerHTML = Array.from({ length: 18 }, () => '<div class="card"><div class="pimg sk"></div></div>').join(''); }
    more.disabled = true; more.innerHTML = '<span class="spin"></span>';
    if (st.sort === 'imdbRating') {
      try {
        if (!st.pool) { const p = await rated(); if (my !== seq) return; st.pool = p.filter(pass); grid.innerHTML = ''; }
        const next = st.pool.slice(st.items.length, st.items.length + 42);
        st.items.push(...next); grid.insertAdjacentHTML('beforeend', next.map(card).join(''));
        st.done = st.items.length >= st.pool.length;
        if (!st.items.length) grid.innerHTML = emptyHTML(I.search, 'Nada com estes filtros', 'Experimenta outro ano, outro género ou uma avaliação mais baixa.');
      } catch (e) { if (reset && my === seq) grid.innerHTML = offlineHTML(); }
      if (my !== seq) return;
      more.disabled = false; more.textContent = 'Carregar mais'; more.parentNode.classList.toggle('hidden', st.done);
      return;
    }
    try {
      let added = 0, tries = 0, first = reset;
      while (added < 12 && !st.done && tries < 5) {
        tries++;
        const x = st.year ? await catalog(cinemeta(), type, 'year', { genre: st.year, skip: st.skip || undefined })
          : await catalog(cinemeta(), type, st.sort, { genre: st.genre || undefined, skip: st.skip || undefined });
        if (my !== seq) return;
        if (first) { grid.innerHTML = ''; first = false; }
        if (!x.length) { st.done = true; break; }
        st.skip += x.length;
        const fresh = x.filter(n => !st.items.some(o => o.id === n.id)).filter(pass);
        st.items.push(...fresh); grid.insertAdjacentHTML('beforeend', fresh.map(card).join('')); added += fresh.length;
      }
      if (!st.items.length) grid.innerHTML = emptyHTML(I.search, 'Nada com estes filtros', 'Experimenta outro ano, outro género ou uma avaliação mais baixa.');
    } catch (e) { if (reset && my === seq) grid.innerHTML = offlineHTML(); }
    if (my !== seq) return;
    more.disabled = false; more.textContent = 'Carregar mais'; more.parentNode.classList.toggle('hidden', st.done);
  };
  const apply = () => { sync(); load(true); };
  $('#gch').onclick = e => { const x = e.target.closest('[data-g]'); if (!x) return; st.genre = x.dataset.g; apply(); };
  $('#fsort').onclick = e => { const x = e.target.closest('[data-sort]'); if (!x) return; st.sort = x.dataset.sort; apply(); };
  $('#fyear').onchange = e => { st.year = e.target.value; apply(); };
  $('#fmin').onchange = e => { st.min = +e.target.value; apply(); };
  $('#freset').onclick = () => { Object.assign(st, { genre: '', year: '', sort: 'top', min: 0 }); apply(); };
  more.onclick = () => load(false);
  sync(); load(true);
}

  const h = (S.searchHistory || []).filter(x => x.toLowerCase() !== q.toLowerCase());
  h.unshift(q); S.searchHistory = h.slice(0, 10); save();
}
function histHTML() {
  const h = S.searchHistory || [];

    <div class="hlist">${h.map((s, i) => `<div class="hitem" tabindex="0" data-hq="${esc(s)}">${I.clock}<span>${esc(s)}</span><button data-hdel="${i}" title="Remover do histórico">${I.x}</button></div>`).join('')}</div></div>`;
}
function showSearchHints() {

}
let searchSeq = 0;
async function doSearch(q) {
  VIEWS._lastQ = q; q = q.trim();
  const box = $('#sres'); if (!box) return;
  if (q.length < 2) return showSearchHints();
  const seq = ++searchSeq;
  box.innerHTML = '<div style="padding:30px;text-align:center"><span class="spin"></span></div>';
  const jobs = [];
  ADDONS.forEach(a => (a.m.catalogs || []).forEach(c => {
    const ex = (c.extra || []).map(e => e.name).concat(c.extraSupported || []);
    if (ex.includes('search')) jobs.push(catalog(a, c.type, c.id, { search: q }).then(items => ({ title: c.type === 'series' ? 'Séries' : c.type === 'movie' ? 'Filmes' : (c.name || c.type), src: a.m.name, items })).catch(() => null));
  }));
  const res = (await Promise.all(jobs)).filter(r => r && r.items.length);
  if (seq !== searchSeq || !$('#sres')) return;
  box.innerHTML = res.length ? res.map(r => `<h3 class="sec">${esc(r.title)} <small style="color:var(--mu2);font-family:var(--fb);font-size:12px;font-weight:500">· ${esc(r.src)}</small></h3><div class="grid" style="margin-bottom:36px">${r.items.slice(0, 24).map(card).join('')}</div>`).join('')
    : emptyHTML(I.search, 'Nada encontrado', `Não encontrámos resultados para “${esc(q)}”. Tenta outro título ou nome.`);
}

  const pre = ITEMS.get(id) || { id, type };
  el.innerHTML = detailShell(pre, true);

const cmpVer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0) ? 1 : -1; return 0; };
const VERSION_URL = /^https?:$/.test(location.protocol) ? 'version.json' : (NATIVE && NATIVE.remote ? NATIVE.remote + '/version.json' : null);
function showUpdate(o) {
  const el = $('#upd');
  el.innerHTML = `<div class="ucard"><div class="uglow"></div><div class="uhead">${LOGO}<h2>${esc(o.title)}</h2><span class="uver">${o.from ? esc(o.from) + ' → ' : ''}<b>v${esc(o.version)}</b></span></div>
    <ul class="ulist">${(o.notes || []).map(n => `<li><i>✓</i><span>${esc(n)}</span></li>`).join('')}</ul>
    <div class="uprog" id="uprog"><b></b></div>
    <div class="ubtns">${o.later ? `<button class="btn gho" data-uclose>${esc(o.later)}</button>` : ''}<button class="btn acc" id="ugo">${esc(o.go)}</button></div></div>`;
  el.classList.add('open');
  el.onclick = e => { if (e.target === el && o.later) el.classList.remove('open'); };
  el.querySelectorAll('[data-uclose]').forEach(b => b.onclick = () => el.classList.remove('open'));
  $('#ugo').onclick = () => { if (o.action) o.action(); else el.classList.remove('open'); };
}
async function checkUpdates(manual) {
  if (!VERSION_URL) { if (manual) toast('Sem servidor de atualizações nesta versão'); return; }
  try {
    const v = await fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
    if (cmpVer(v.version, APP_VERSION) > 0) {
      return showUpdate({ title: 'Nova atualização disponível', from: 'v' + APP_VERSION, version: v.version, notes: v.notes, later: 'Mais tarde', go: 'Atualizar agora', action: async () => {
        $('#uprog').style.display = 'block'; $('#ugo').disabled = true; $('#ugo').textContent = 'A atualizar…';
        try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch (e) {}
        try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
        setTimeout(() => location.reload(), 700);
      } });
    }
    if (NATIVE && v.native && v.native.min && cmpVer(v.native.min, NATIVE.version) > 0) {
      const url = v.native.download;
      return showUpdate({ title: 'Nova versão da app', from: 'v' + NATIVE.version, version: v.native.min, notes: v.native.notes || ['Esta atualização precisa de reinstalar a app.'], later: 'Mais tarde', go: url ? 'Descarregar' : 'Entendido', action: () => { if (url) window.open(url, '_blank', 'noopener'); $('#upd').classList.remove('open'); } });
    }
    if (manual) toast('Já tens a versão mais recente (' + APP_VERSION + ')');
  } catch (e) { if (manual) toast('Não foi possível verificar atualizações'); }
}

}

function showProfiles(manage) {
  const el = $('#profiles');
  el.dataset.manage = manage ? '1' : '';
  el.innerHTML = `<div class="pwrap"><h2>${manage ? 'Gerir perfis' : 'Quem está a ver?'}</h2>
    <div class="plist">${S.profiles.map(p => `<button class="pcard ${p.id === S.activeProfile ? 'on' : ''}" data-prof="${p.id}">${avatar(p, 104)}<b>${esc(p.name)}</b>${manage ? '<small>Editar</small>' : ''}</button>`).join('')}
    ${S.profiles.length < 6 ? `<button class="pcard" data-prof-add><span class="pav" style="--pc:#3a3446;width:104px;height:104px">${I.plus}</span><b>Adicionar</b></button>` : ''}</div>
    <div class="pact">${manage ? '<button class="btn pri" data-prof-done>Concluído</button>' : '<button class="btn gho" data-prof-manage>Gerir perfis</button>'}</div></div>`;
  el.classList.add('open');
  setTimeout(() => el.querySelector('.pcard.on, .pcard')?.focus(), 50);
}
function editProfile(id) {
  const p = id ? Object.assign({}, S.profiles.find(x => x.id === id)) : { id: 'p' + Date.now().toString(36), name: '', color: S.profiles.length % PCOLORS.length };
  const el = $('#profiles');
  el.innerHTML = `<div class="pwrap"><h2>${id ? 'Editar perfil' : 'Novo perfil'}</h2><div class="pedit">${avatar(p, 112)}<input class="inp" id="pname" maxlength="18" placeholder="Nome" value="${esc(p.name)}">
    <div class="swatches" id="pcol">${PCOLORS.map((c, i) => `<button class="sw ${i === p.color ? 'on' : ''}" data-pc="${i}" style="background:${c}"></button>`).join('')}</div></div>
    <div class="pact"><button class="btn pri" id="psave">Guardar</button><button class="btn gho" data-prof-manage>Cancelar</button>${id && S.profiles.length > 1 ? '<button class="btn gho" id="pdel" style="color:#ff8fa8">Apagar perfil</button>' : ''}</div></div>`;
  const av = el.querySelector('.pedit .pav');
  $('#pcol').onclick = e => { const b = e.target.closest('[data-pc]'); if (!b) return; p.color = +b.dataset.pc; [...$('#pcol').children].forEach(x => x.classList.toggle('on', x === b)); av.style.setProperty('--pc', PCOLORS[p.color]); };
  $('#pname').oninput = e => { av.textContent = (e.target.value.trim()[0] || '?').toUpperCase(); };
  $('#pname').onkeydown = e => { if (e.key === 'Enter') $('#psave').click(); };
  setTimeout(() => $('#pname').focus(), 50);
  $('#psave').onclick = () => {
    const name = $('#pname').value.trim(); if (!name) return toast('Escreve um nome para o perfil');
    const ex = S.profiles.find(x => x.id === p.id);
    if (ex) Object.assign(ex, { name, color: p.color }); else { S.profiles.push({ id: p.id, name, color: p.color }); S.pdata[p.id] = emptyPData(); }
    save(); updateProfBtn(); showProfiles(true);
  };
  const del = $('#pdel');
  if (del) del.onclick = function () {
    if (!this.dataset.c) { this.dataset.c = 1; this.textContent = 'Carrega outra vez para apagar'; return; }
    S.profiles = S.profiles.filter(x => x.id !== id); delete S.pdata[id];
    if (S.activeProfile === id) S.activeProfile = S.profiles[0].id;
    save(); updateProfBtn(); showProfiles(true);
  };
}

/* ---------- TV e comando ---------- */
const IS_TV = /Android TV|\bAFT|BRAVIA|SmartTV|SMART-TV|GoogleTV|Tizen|Web0S|WebOS|HbbTV|Leanback|\bTV\b.*Android|Android.*\bTV\b/i.test(navigator.userAgent);
function applyTV() { document.documentElement.classList.toggle('tv', !!(S.prefs.tv ?? IS_TV)); }
function topLayer() {
  if ($('#profiles').classList.contains('open')) return $('#profiles');
  if ($('#upd').classList.contains('open')) return $('#upd');
  if (drawer.classList.contains('open')) return $('.dpanel');
  if ($('#detail').classList.contains('open')) return $('#detail');
  return document.body;
}
function focusables() {
  const top = topLayer();
  return [...top.querySelectorAll('button, a[href], input, select, [tabindex]:not([tabindex="-1"])')].filter(el => {
    if (el.disabled || el.closest('#player') || el.closest('.hdots')) return false;
    const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0;
  });
}
function moveFocus(dir) {
  const list = focusables(); if (!list.length) return;
  const cur = list.includes(document.activeElement) ? document.activeElement : null;
  if (!cur) { const first = list.find(el => { const r = el.getBoundingClientRect(); return r.top >= 0 && r.top < innerHeight && !el.closest('#nav'); }) || list[0]; first.focus({ preventScroll: true }); first.scrollIntoView({ block: 'center', inline: 'nearest' }); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const el of list) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), dx = r.left + r.width / 2 - ax, dy = r.top + r.height / 2 - ay;
    let main, cross;
    if (dir === 'left') { if (r.right > a.left + 2) continue; main = -dx; cross = Math.abs(dy); }
    else if (dir === 'right') { if (r.left < a.right - 2) continue; main = dx; cross = Math.abs(dy); }
    else if (dir === 'up') { if (r.bottom > a.top + 2) continue; main = -dy; cross = Math.abs(dx); }
    else { if (r.top < a.bottom - 2) continue; main = dy; cross = Math.abs(dx); }
    const sc = main + cross * 2.5; if (sc < bs) { bs = sc; best = el; }
  }
  if (best) { best.focus({ preventScroll: true }); best.scrollIntoView({ block: best.closest('#nav') ? 'nearest' : 'center', inline: 'center', behavior: 'smooth' }); }
}

/* ---------- router ---------- */
function route() {
  if (CUR_VIEW === 'search' && VIEWS._lastQ) addHistory(VIEWS._lastQ);
  const v = location.hash.slice(1) || 'home';
  const name = VIEWS[v] && v[0] !== '_' ? v : 'home';
  document.querySelectorAll('.nv').forEach(a => a.classList.toggle('on', a.dataset.v === name));
  if ($('#detail').classList.contains('open')) { $('#detail').classList.remove('open'); document.body.style.overflow = ''; }
  closeDrawer(); clearInterval(heroTimer); scrollTo(0, 0);
  CUR_VIEW = name; presenceView(name);
  const r = VIEWS[name]();
  if (name === 'movies' && VIEWS._pickG) { const g = VIEWS._pickG; VIEWS._pickG = null; setTimeout(() => document.querySelector(`[data-g="${g}"]`)?.click(), 0); }
  if (r && r.catch) r.catch(err => { console.error(err); app.innerHTML = `<div class="view">${topbar('')}<div class="pad">${offlineHTML()}</div></div>`; });
}
window.addEventListener('hashchange', route);

function gateProfiles() {
  const root = document.documentElement, pr = $('#profiles');
  const ungate = () => { root.classList.remove('vvgate'); try { sessionStorage.setItem('vv_prof', '1'); } catch (e) {} };
  const sw = window.switchProfile;
  window.switchProfile = function (id) {
    if (!root.classList.contains('vvgate')) return sw.apply(this, arguments);
    const p = S.profiles.find(x => x.id === id);
    if (p && p.pin && id === S.activeProfile) { S.pdata.__g = S.pdata[id]; S.activeProfile = '__g'; try { return sw.apply(this, arguments); } finally { if (S.activeProfile === '__g') S.activeProfile = id; delete S.pdata.__g; } }
    return sw.apply(this, arguments);
  };
  new MutationObserver(() => { if (root.classList.contains('vvgate') && !pr.classList.contains('open')) ungate(); }).observe(pr, { attributes: true, attributeFilter: ['class'] });
  showProfiles(false);
}
async function boot() {
  applyAccent();
  window.__vvReady = false;
  if (document.documentElement.classList.contains('vvgate')) gateProfiles();
  app.innerHTML = `<div class="view" style="display:grid;place-items:center;min-height:100vh"><span class="spin" style="width:40px;height:40px;border-width:4px"></span></div>`;
  try { await loadAddons(); window.__vvReady = true; route(); afterBoot(); }
  catch (e) { app.innerHTML = `<div class="view">${topbar('')}<div class="pad">${offlineHTML()}</div></div>`; }
}
document.addEventListener('DOMContentLoaded', boot);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
