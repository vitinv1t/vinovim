<title>Vinovim</title>
<meta name="theme-color" content="#09080d">
<meta name="description" content="vinovim — o teu hub de filmes e séries">
<script>
// No browser normal, o site abre a página de downloads; as apps instaladas abrem o Vinovim
(function () { try {
  if (/[?&]web\b/.test(location.search)) localStorage.setItem('vinovim.web', '1');
  var ua = navigator.userAgent;
  var isApp = window.vinovimNative || window.Capacitor || /Electron|; wv\)/.test(ua) || navigator.standalone ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || localStorage.getItem('vinovim.web');
  if (!isApp && /^https?:$/.test(location.protocol)) location.replace('/download');
} catch (e) {} })();
</script>

<style id="vvgate">html.vvgate,html.vvgate body{background:#0a0a0f}html.vvgate body>*:not(#vvIntro):not(#profiles):not(#vvLogin):not(.xmodal):not(#toast){visibility:hidden!important}</style>
<style>html.vvpre,html.vvpre body{background:#000!important}html.vvpre body>*:not(#vvIntro){visibility:hidden!important}</style>
<script>(function(){try{var R=document.documentElement,h=location.hash.slice(1),deep=/^(comando|colab|lista)=/.test(h);if(!deep&&!sessionStorage.getItem('vv_prof'))R.classList.add('vvgate');
var st={};try{st=JSON.parse(localStorage.getItem('vinovim.v1'))||{}}catch(e){}
if(!deep&&!sessionStorage.getItem('vv_intro')&&!(st.prefs&&st.prefs.intro===false)){R.classList.add('vvpre');var t0=Date.now(),t=setInterval(function(){var i=document.getElementById('vvIntro');if((document.readyState!=='loading'&&(!i||i.classList.contains('out')))||Date.now()-t0>6000){R.classList.remove('vvpre');clearInterval(t)}},40)}}catch(e){}})();</script>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ac)"/><stop offset="1" stop-color="var(--ac2)"/></linearGradient></defs></svg>

<nav id="nav">
  <a class="brand" href="#home" title="vinovim">
    <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="url(#lg)"/><path d="M14 13 L24 35 L34 13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="13" r="3" fill="#fff"/></svg>
    <span>Vinovim</span>
  </a>
  <a class="nv" data-v="home" href="#home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
  <a class="nv" data-v="search" href="#search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Pesquisar</a>

  <a class="nv dk" data-v="series" href="#series"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg>Séries</a>

<main id="app"></main>

<div id="detail"></div>

<div id="drawer"><div class="scrim" data-close-drawer></div><div class="dpanel"><div class="dph"><div style="flex:1"><h3 id="drTitle"></h3><small id="drSub"></small></div><button class="pb" data-close-drawer aria-label="Fechar"></button></div><div class="dpb" id="drBody"></div></div></div>

<div id="player">
  <video id="vid" playsinline crossorigin="anonymous"></video>
  <div id="yt"></div>
  <div class="perr" id="pErr"><div><h3>Não foi possível reproduzir</h3><p id="pErrMsg"></p><div class="hbtns" style="justify-content:center"><button class="btn gho" id="pErrOpen">Abrir noutra app</button><button class="btn pri" id="pErrBack">Escolher outra fonte</button></div></div></div>
  <div class="pui" id="pUi">
    <div class="ptop"><button class="pb" id="pBack" aria-label="Voltar"></button><div style="min-width:0"><b id="pTitle"></b><small id="pSub"></small></div></div>
    <div class="pmid" id="pMid"></div>
    <div class="pbot" id="pBot">
      <div class="seek" id="pSeek"><div class="tr"><div class="bf" id="pBuf"></div><div class="pg" id="pProg"></div></div><div class="kn" id="pKnob"></div><div class="tip" id="pTip">0:00</div></div>
      <div class="pctl">
        <button class="pb" id="pPlay" aria-label="Reproduzir"></button>
        <button class="pb" id="pRew" aria-label="Recuar 10s"></button>
        <button class="pb" id="pFwd" aria-label="Avançar 10s"></button>
        <button class="pb" id="pMute" aria-label="Som"></button>
        <input type="range" class="vol" id="pVol" min="0" max="1" step="0.02" value="1">
        <span class="ptime" id="pTime">0:00 / 0:00</span>
        <div class="tsp"></div>
        <button class="pb" id="pNext" aria-label="Próximo episódio"></button>
        <button class="pb" id="pCC" aria-label="Legendas e velocidade"></button>
        <button class="pb" id="pFs" aria-label="Ecrã inteiro"></button>
      </div>
    </div>
    <div class="pmenu" id="pMenu"></div>
    <div class="nextup" id="nextUp"><div><small>A seguir</small><b id="nextName"></b></div><button class="btn sm pri" id="nextGo">Ver agora</button></div>
  </div>
</div>

<input type="file" id="fileVideo" accept="video/*,.mkv" hidden>
<input type="file" id="fileSub" accept=".srt,.vtt" hidden>
<input type="file" id="fileImport" accept=".json" hidden>
<div id="toast"></div>
<div id="upd"></div>
<div id="profiles"></div>
