<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar · Vinovim</title>
<meta name="theme-color" content="#07060b">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#07060b;color:#f6f3fb;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(700px 420px at 50% 0%,rgba(139,92,255,.28),transparent 70%),radial-gradient(600px 400px at 100% 100%,rgba(255,77,148,.14),transparent 70%),#07060b}
.cx{width:min(400px,100%);padding:30px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
h1{font:700 24px Poppins,sans-serif;letter-spacing:-.02em;margin-bottom:6px}
p{color:#a9a2b8;font-size:14px;line-height:1.5;margin-bottom:22px}
label{display:block;font-size:13px;color:#cfc8dc;margin:14px 0 6px}
input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.35);color:#fff;font:inherit;outline:none}
input:focus-visible{border-color:#ff4d94;box-shadow:0 0 0 3px rgba(255,77,148,.2)}
button{margin-top:22px;width:100%;height:48px;border:0;border-radius:12px;font:600 15px Inter,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(110deg,#8b5cff,#ff4d94 60%,#ff6a6a)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.er{min-height:20px;margin-top:12px;font-size:13px;color:#ff8fa8}
a{color:#a9a2b8;font-size:13px;display:block;text-align:center;margin-top:14px;text-decoration:none}
</style>
</head>
<body>
<form class="cx" id="f" autocomplete="on">
  <h1>Entrar na equipa</h1>
  <p>Só o administrador do Vinovim tem acesso. A sessão fica guardada neste navegador durante 7 dias.</p>
  <label for="e">Email</label><input id="e" name="email" type="email" autocomplete="username" required maxlength="254">
  <label for="p">Palavra-passe</label><input id="p" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200">
  <button id="b" type="submit">Entrar</button>
  <div class="er" id="er" role="alert"></div>
  <a href="/manutencao">Voltar</a>
</form>
<script>
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var b = document.getElementById('b'), er = document.getElementById('er');
  b.disabled = true; b.textContent = 'A entrar...'; er.textContent = '';
  fetch('/api/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: JSON.stringify({ email: document.getElementById('e').value.trim(), password: document.getElementById('p').value }) })
    .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
    .then(function (x) {
      if (x.s === 200) return (location.href = '/');
      er.textContent = x.s === 429 ? 'Demasiadas tentativas. Tenta daqui a 10 minutos.' : 'Email ou palavra-passe incorretos.';
      b.disabled = false; b.textContent = 'Entrar';
    })
    .catch(function () { er.textContent = 'Sem ligação. Tenta outra vez.'; b.disabled = false; b.textContent = 'Entrar'; });
});
</script>
</body>
</html>
