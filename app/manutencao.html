<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vinovim</title>
<meta name="theme-color" content="#0a0811">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@400;500&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --sala: #0a0811; --rosa: #ff4d94; --violeta: #8b5cff; --texto: #f6f1fb; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#0d0a16, #06050a);
    color: var(--texto);
    font: 400 17px/1.5 'Hanken Grotesk', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .sala { position: fixed; inset: 0; overflow: hidden; }

  /* luz que o ecrã deita na sala */
  .luz {
    position: absolute; left: 50%; top: 34%;
    width: 120vw; height: 70vh; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(122, 61, 255, .30), rgba(255, 77, 148, .10) 55%, transparent);
    filter: blur(40px); opacity: 0;
    animation: acende 1.6s 1.4s ease-out forwards;
  }

  /* o ecrã */
  .ecra {
    --w: min(1060px, 74vw, 50vh * 2.3);
    max-width: calc(100vw - 48px);
    position: absolute; left: 50%; top: max(72px, 10vh);
    width: var(--w); min-height: calc(var(--w) / 2.3);
    transform: translateX(-50%);
    border-radius: 12px;
    background: #17121f;
    box-shadow: 0 0 0 14px #17121f, 0 30px 120px rgba(255, 77, 148, .22);
    display: grid; place-items: center; text-align: center;
    overflow: hidden;
  }
  .ecra::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(60% 70% at 50% 50%, rgba(255, 214, 234, .28), transparent 70%),
      linear-gradient(100deg, #2a1450, #5a1f6e 55%, #8a2556);
    box-shadow: inset 0 0 80px rgba(0, 0, 0, .55);
    opacity: 0;
    animation: projetor 1.4s 1.25s steps(1) forwards, respira 7s 3s ease-in-out infinite;
  }
  .projecao { position: relative; display: grid; justify-items: center; gap: 16px; padding: 32px 28px; opacity: 0; animation: aparece 1s 1.9s ease-out forwards; }
  .nome { width: min(520px, 56vw, 60vh); height: auto; filter: drop-shadow(0 0 22px rgba(255, 179, 212, .55)); }
  h1 { font: 700 clamp(22px, 2.4vw, 34px)/1.15 'Bricolage Grotesque', sans-serif; letter-spacing: -.01em; margin-top: 6px; }
  .projecao p { max-width: 34em; color: rgba(241, 230, 247, .8); font-size: clamp(15px, 1.35vw, 19px); }
  .projecao .peq { font-size: clamp(13px, 1vw, 15px); color: rgba(241, 230, 247, .55); margin-top: 4px; }
  #po { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* cortinas */
  .cortina { position: absolute; top: 0; height: 78vh; width: 52vw; display: flex; z-index: 3; animation: abre 2.4s .35s cubic-bezier(.6, .02, .2, 1) forwards; }
  .cortina.esq { left: 0; transform-origin: left; flex-direction: row; }
  .cortina.dir { right: 0; transform-origin: right; flex-direction: row-reverse; }
  .cortina i {
    flex: 1; border-radius: 0 0 24px 24px;
    background: linear-gradient(90deg, #2a0a24, #6b1640 45%, #1c0618);
    height: calc(100% - var(--k) * 3.2%);
  }
  .cortina::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(0,0,0,.5), transparent 60%); }
  .cortina.esq::before, .cortina.dir::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .cortina.esq::before { background: linear-gradient(90deg, rgba(0,0,0,.65), transparent); }
  .cortina.dir::before { background: linear-gradient(270deg, rgba(0,0,0,.65), transparent); }
  @keyframes abre { to { transform: scaleX(.34); } }

  /* cadeiras */
  .cadeiras { position: absolute; inset: auto 0 0 0; height: 34vh; z-index: 4; }
  .cadeiras b {
    position: absolute; border-radius: 32% 32% 6px 6px / 28% 28% 6px 6px;
    box-shadow: inset 0 2px 3px rgba(255, 122, 176, var(--rim));
  }
  .cadeiras svg.p { position: absolute; overflow: visible; transform-origin: 50% 100%; }
  .cadeiras svg.p.mexe { animation: mexe var(--d) ease-in-out infinite; animation-delay: var(--dl); }
  .cadeiras svg.p.encosta-e { transform: rotate(-5deg); transform-origin: 30% 100%; }
  .cadeiras svg.p.encosta-d { transform: rotate(5deg); transform-origin: 70% 100%; }
  @keyframes mexe { 0%, 70%, 100% { transform: none; } 78%, 92% { transform: rotate(var(--rot)) translateY(-2%); } }
  .cadeiras::after { content: ''; position: absolute; inset: 30% 0 0; background: linear-gradient(transparent, rgba(5, 4, 8, .95)); }

  .topo { position: absolute; inset: 28px 40px auto; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  .marca { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; color: #fff; font: 700 20px 'Poppins', sans-serif; letter-spacing: -.02em; -webkit-tap-highlight-color: transparent; cursor: default; }
  .marca svg { width: 28px; height: 28px; }
  .estado { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 14px; border-radius: 99px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); font-weight: 500; font-size: 15px; }
  .estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--rosa); animation: pulso 2s infinite; }
  .nota { position: absolute; left: 0; right: 0; margin: 0 auto; width: min(92vw, 640px); text-align: center; z-index: 5; font-weight: 500; font-size: 15px; color: rgba(255,255,255,.62); opacity: 0; animation: aparece 1s 2.6s forwards; }

  @keyframes projetor { 0% { opacity: .3 } 8% { opacity: 0 } 16% { opacity: .7 } 22% { opacity: .2 } 32%, 100% { opacity: 1 } }
  @keyframes respira { 50% { filter: brightness(1.08) saturate(1.1); } }
  @keyframes acende { to { opacity: 1; } }
  @keyframes aparece { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(255,77,148,.6); } 100% { box-shadow: 0 0 0 10px rgba(255,77,148,0); } }

  @media (max-width: 1000px) { .ecra { --w: 86vw; } }
  @media (max-width: 700px) {
    .ecra { --w: calc(100vw - 60px); min-height: min(46vh, 400px); top: 96px; box-shadow: 0 20px 70px rgba(255, 77, 148, .25); border-radius: 10px; }
    .nome { width: 72%; }
    .projecao p { max-width: 19em; }
    .topo { inset: 34px 20px auto; }
    .marca { font-size: 17px; } .marca svg { width: 24px; height: 24px; }
    .estado { font-size: 13px; padding: 6px 12px 6px 11px; }
    .cortina { height: 62vh; }
    @keyframes abre { to { transform: scaleX(.12); } }
    .nota { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="pele" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3a78"/><stop offset=".12" stop-color="#3a1a3c"/><stop offset=".3" stop-color="#16101c"/><stop offset="1" stop-color="#07060b"/></linearGradient>
  <linearGradient id="pipoca" x1="0" x2="1"><stop offset="0" stop-color="#3b1830"/><stop offset=".5" stop-color="#5a2340"/><stop offset="1" stop-color="#2a0f22"/></linearGradient>
</defs></svg>
<div class="sala">
  <div class="luz"></div>
  <div class="ecra" id="ecra">
    <canvas id="po"></canvas>
    <div class="projecao">
      <svg class="nome" viewBox="8 -802 4018 812" role="img" aria-label="vinovim"><g fill="#fff"><path d="M313 -160 434 -558H616L418 0H207L9 -558H192Z"/><path d="M827 -558V0H656V-558Z"/><path d="M640 -708Q640 -748 668.5 -774.5Q697 -801 742 -801Q786 -801 814.5 -774.5Q843 -748 843 -708Q843 -669 814.5 -642.5Q786 -616 742 -616Q697 -616 668.5 -642.5Q640 -669 640 -708Z"/><path d="M1498 -326V0H1328V-303Q1328 -359 1299 -390Q1270 -421 1221 -421Q1172 -421 1143 -390Q1114 -359 1114 -303V0H943V-558H1114V-484Q1140 -521 1184 -542.5Q1228 -564 1283 -564Q1381 -564 1439.5 -500.5Q1498 -437 1498 -326Z"/><path d="M1569 -279Q1569 -365 1607 -430.5Q1645 -496 1711 -531Q1777 -566 1859 -566Q1941 -566 2007 -531Q2073 -496 2111 -430.5Q2149 -365 2149 -279Q2149 -193 2110.5 -127.5Q2072 -62 2005.5 -27Q1939 8 1857 8Q1775 8 1709.5 -27Q1644 -62 1606.5 -127Q1569 -192 1569 -279ZM1975 -279Q1975 -346 1941.5 -382Q1908 -418 1859 -418Q1809 -418 1776 -382.5Q1743 -347 1743 -279Q1743 -212 1775.5 -176Q1808 -140 1857 -140Q1906 -140 1940.5 -176Q1975 -212 1975 -279Z"/><path d="M2455 -160 2576 -558H2758L2560 0H2349L2151 -558H2334Z"/><path d="M2969 -558V0H2798V-558Z"/><path d="M2782 -708Q2782 -748 2810.5 -774.5Q2839 -801 2884 -801Q2928 -801 2956.5 -774.5Q2985 -748 2985 -708Q2985 -669 2956.5 -642.5Q2928 -616 2884 -616Q2839 -616 2810.5 -642.5Q2782 -669 2782 -708Z"/><path d="M4024 -326V0H3854V-303Q3854 -357 3825.5 -386.5Q3797 -416 3747 -416Q3697 -416 3668.5 -386.5Q3640 -357 3640 -303V0H3470V-303Q3470 -357 3441.5 -386.5Q3413 -416 3363 -416Q3313 -416 3284.5 -386.5Q3256 -357 3256 -303V0H3085V-558H3256V-488Q3282 -523 3324 -543.5Q3366 -564 3419 -564Q3482 -564 3531.5 -537Q3581 -510 3609 -460Q3638 -506 3688 -535Q3738 -564 3797 -564Q3901 -564 3962.5 -501Q4024 -438 4024 -326Z"/></g></svg>
      <h1>A sessão começa já a seguir.</h1>
      <p>Estamos a montar a versão 1.0.0. A tua conta, a tua lista e o que estavas a ver ficam guardados.</p>
      <p class="peq">Tens a app instalada? Não precisas de fazer nada: ela abre sozinha quando a sessão começar.</p>
    </div>
  </div>
  <div class="cortina esq" aria-hidden="true"></div>
  <div class="cortina dir" aria-hidden="true"></div>
  <div class="cadeiras" id="cadeiras" aria-hidden="true"></div>
  <header class="topo">
    <button class="marca" id="marca" type="button" aria-label="Vinovim">
      <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#ff4d94"/><stop offset="1" stop-color="#ff6a6a"/></linearGradient><linearGradient id="gb" x1="0" x2="1"><stop offset="0" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff4d94"/></linearGradient></defs><path d="M32.6 13.6 24 34.4" stroke="url(#ga)" stroke-width="6.1" stroke-linecap="round" fill="none" opacity=".75"/><path d="M15.4 13.6 24 34.4" stroke="url(#gb)" stroke-width="6.1" stroke-linecap="round" fill="none"/></svg>
      vinovim
    </button>
    <span class="estado"><i aria-hidden="true"></i>Em manutenção</span>
  </header>
</div>
<script>
(function () {
  var fold = function (el, n) { for (var i = 0; i < n; i++) { var f = document.createElement('i'); f.style.setProperty('--k', el.classList.contains('esq') ? i : i); el.appendChild(f); } };
  document.querySelectorAll('.cortina').forEach(function (c) { fold(c, innerWidth < 700 ? 6 : 9); });

  function cadeiras() {
    var box = document.getElementById('cadeiras'), W = innerWidth, fundo = document.getElementById('ecra').getBoundingClientRect().bottom;
    box.style.height = Math.max(110, Math.min(innerHeight * 0.34, innerHeight - fundo - 6)) + 'px';
    var H = box.clientHeight, s = Math.min(W < 700 ? 0.72 : 1, H / (innerHeight * 0.34) * (W < 700 ? 0.72 : 1) + 0.25);
    box.innerHTML = ''; semente = 7;
    [{ y: .02, w: 46, h: 54, g: 10, c: '#141019', r: .25 }, { y: .24, w: 62, h: 74, g: 12, c: '#100c15', r: .2 }, { y: .55, w: 92, h: 120, g: 16, c: '#0b0810', r: .14 }]
      .forEach(function (r, k) {
        var w = r.w * s, h = r.h * s, g = r.g * s, step = w + g, n = Math.ceil(W / step) + 2, off = k % 2 ? step / 2 : 4;
        var antes = null;
        for (var i = 0; i < n; i++) {
          var x = i * step - off, curva = Math.pow((x + w / 2 - W / 2) / (W / 2), 2) * 16 * s, b = document.createElement('b');
          var topo = r.y * H - curva;
          if (rnd() < [0.55, 0.5, 0.42][k]) {
            var pw = w * 1.22, ph = pw * 1.2, p = pessoa(pw, ph);
            p.style.left = (x - (pw - w) / 2) + 'px';
            p.style.top = (topo - ph * 0.8) + 'px';
            box.appendChild(p);
            if (antes && antes.i === i - 1 && rnd() < 0.3) { antes.el.classList.add('encosta-d'); p.classList.add('encosta-e'); }
            else if (rnd() < 0.12) { p.classList.add('mexe'); p.style.setProperty('--d', (7 + rnd() * 6) + 's'); p.style.setProperty('--dl', (-rnd() * 10) + 's'); p.style.setProperty('--rot', (rnd() < .5 ? -1 : 1) * (6 + rnd() * 6) + 'deg'); }
            antes = { i: i, el: p };
          }
          b.style.cssText = 'left:' + x + 'px;top:' + topo + 'px;width:' + w + 'px;height:' + h + 'px;background:' + r.c + ';--rim:' + r.r;
          box.appendChild(b);
        }
      });
  }
  // pessoas sentadas, de costas, com a luz do ecrã no cabelo
  var semente = 7;
  function rnd() { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; }
  var CABELO = [
    '',
    '<circle cx="50" cy="20" r="10"/>',
    '<path d="M27 44C27 16 73 16 73 44L77 96C66 101 34 101 23 96Z"/>',
    '<path d="M28 40C29 17 71 17 72 40Z"/><path d="M68 37 86 44 68 45Z"/>',
    '<circle cx="33" cy="35" r="10"/><circle cx="67" cy="35" r="10"/><circle cx="40" cy="24" r="11"/><circle cx="60" cy="24" r="11"/><circle cx="50" cy="20" r="11"/>',
    '<path d="M29 44C29 22 71 22 71 44L72 60C64 64 36 64 28 60Z"/>'
  ];
  var PIPOCA = '<g transform="translate(74 54) rotate(8)"><path d="M0 0H22L19 30H3Z" fill="url(#pipoca)"/><circle cx="5" cy="-1" r="4.5"/><circle cx="12" cy="-3" r="5"/><circle cx="18" cy="-1" r="4.5"/></g>';
  function pessoa(w, h) {
    var cab = CABELO[Math.floor(rnd() * CABELO.length)], extra = rnd() < 0.1 ? PIPOCA : '', crianca = rnd() < 0.12;
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 100 120');
    s.setAttribute('class', 'p');
    s.style.width = w + 'px';
    s.style.height = h + 'px';
    s.innerHTML = '<g fill="url(#pele)"' + (crianca ? ' transform="translate(15 30) scale(.7)"' : '') + '>' +
      '<path d="M6 120C6 92 23 81 50 81C77 81 94 92 94 120Z"/><path d="M41 64H59V86H41Z"/><ellipse cx="50" cy="47" rx="21" ry="24"/>' + cab + extra + '</g>';
    return s;
  }
  cadeiras();
  addEventListener('resize', function () { semente = 7; cadeiras(); });

  // pó a flutuar na luz do projetor
  var cv = document.getElementById('po'), cx = cv.getContext('2d'), pts = [], dpr = Math.min(devicePixelRatio || 1, 2);
  function tamanho() { cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; }
  tamanho(); addEventListener('resize', tamanho);
  for (var i = 0; i < 60; i++) pts.push({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.6, v: .00004 + Math.random() * .00012, a: .15 + Math.random() * .5, f: Math.random() * 6 });
  var quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function anda(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    pts.forEach(function (p) {
      if (!quieto) { p.y -= p.v * 16; p.x += Math.sin(t / 2600 + p.f) * .00012; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); } }
      cx.globalAlpha = p.a * (.6 + .4 * Math.sin(t / 900 + p.f));
      cx.fillStyle = '#ffe6f2';
      cx.beginPath(); cx.arc(p.x * cv.width, p.y * cv.height, p.r * dpr, 0, 7); cx.fill();
    });
    if (!quieto) requestAnimationFrame(anda);
  }
  requestAnimationFrame(anda);

  function abrir() { location.replace('/' + (/[?&]web\b/.test(location.search) ? '?web' : '')); }
  var toques = 0, t0 = 0;
  document.getElementById('marca').addEventListener('click', function () {
    var agora = Date.now(); toques = agora - t0 < 900 ? toques + 1 : 1; t0 = agora;
    if (toques >= 5) { try { localStorage.setItem('vinovim.obras', '1'); } catch (e) {} abrir(); }
  });
  setInterval(function () {
    fetch('/version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (v) { if (!v.manutencao) abrir(); }).catch(function () {});
  }, 60000);
})();
</script>
</body>
</html>
