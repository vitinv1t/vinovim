name: VINOVIM quality checks

on:
  push:
    branches:
      - main
      - feature/vinovim-aggregator-core
    paths:
      - "app/js/**"
      - "server/**"
      - "api/**"
      - "docs/VINOVIM.md"
      - ".github/workflows/vinovim-ci.yml"
      - ".github/workflows/vinovim-addon.yml"
  pull_request:
    paths:
      - "app/js/**"
      - "server/**"
      - ".github/workflows/vinovim-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Tests and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find app/js server api -name "*.js" -print0 | xargs -0 -n1 node --check
      - name: Run VINOVIM tests
        run: node --test server/test/*.test.js
