name: Compilar vinovim (.apk e .exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ficheiros e icones
        shell: bash
        run: |
          pip install pillow
          mkdir -p www electron
          cp index.html sw.js manifest.webmanifest icon.svg version.json www/
          cp main.js preload.js remote.json electron/
          python make_icons.py
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: vinovim-windows
          path: dist/*.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ficheiros e icones
        run: |
          pip install pillow
          mkdir -p www electron
          cp index.html sw.js manifest.webmanifest icon.svg version.json www/
          cp main.js preload.js remote.json electron/
          python make_icons.py
      - run: npm install
      - name: Ligar a app Android ao site (atualiza-se sozinha)
        run: node -e "const fs=require('fs');const c=require('./capacitor.config.json');const r=require('./remote.json');if(r.url){c.server=Object.assign({},c.server,{url:r.url,cleartext:false})}fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - run: npx cap add android
      - name: Icone e ecra de arranque
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#09080d' --splashBackgroundColor '#09080d'
        continue-on-error: true
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk vinovim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vinovim-android
          path: vinovim.apk
