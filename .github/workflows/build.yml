name: Compilar vinovim (.apk e .exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vinovim-build
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ficheiros e icones
        shell: bash
        run: |
          pip install pillow
          mkdir -p www electron
          cp index.html extra.js extra2.js sw.js manifest.webmanifest icon.svg version.json www/
          cp main.js preload.js remote.json electron/
          python make_icons.py
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: vinovim-windows
          path: dist/*.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ficheiros e icones
        run: |
          pip install pillow
          mkdir -p www electron
          cp index.html extra.js extra2.js sw.js manifest.webmanifest icon.svg version.json www/
          cp main.js preload.js remote.json electron/
          python make_icons.py
      - run: npm install
      - name: Ligar a app Android ao site (atualiza-se sozinha)
        run: node -e "const fs=require('fs');const c=require('./capacitor.config.json');const r=require('./remote.json');if(r.url){c.server=Object.assign({},c.server,{url:r.url,cleartext:false})}fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - name: Plugins nativos (widget, abrir links)
        run: npm install --no-save @capacitor/preferences@^6 @capacitor/app@^6
      - name: Plugin de voz (opcional)
        run: npm install --no-save @capacitor-community/speech-recognition@^6
        continue-on-error: true
      - run: npx cap add android
      - name: Icone e ecra de arranque
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#09080d' --splashBackgroundColor '#09080d'
        continue-on-error: true
      - run: npx cap sync android
      - name: Widget Continuar a ver e microfone
        run: python android_widget.py
      - name: Suporte para Android TV (comando e launcher da TV)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i -E 's#(<category android:name="android.intent.category.LAUNCHER" ?/>)#\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' "$M"
          sed -i -E 's#<application#<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application android:banner="@drawable/tv_banner"#' "$M"
          mkdir -p android/app/src/main/res/drawable
          cp assets/tv-banner.png android/app/src/main/res/drawable/tv_banner.png
          grep -n "LEANBACK\|leanback\|banner" "$M"
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk vinovim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vinovim-android
          path: vinovim.apk

  publish:
    name: Publicar no site (vinovim.vercel.app)
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Montar o site com os downloads
        run: |
          pip install pillow
          python make_icons.py
          mkdir -p site/public/downloads
          cp index.html extra.js extra2.js sw.js manifest.webmanifest icon.svg version.json download.html site/public/
          mkdir -p site/api && cp api-account.js site/api/account.js && cp site-package.json site/package.json
          cp -r www/icons site/public/icons
          cp "$(ls artifacts/vinovim-windows/*.exe | head -n 1)" site/public/downloads/vinovim-setup.exe
          cp artifacts/vinovim-android/vinovim.apk site/public/downloads/vinovim.apk
          python -c "import json,os;d='site/public/downloads';json.dump({f:os.path.getsize(os.path.join(d,f)) for f in os.listdir(d)},open('site/public/downloads.json','w'))"
          cp site-vercel.json site/vercel.json
          ls -la site/public site/public/downloads
      - name: Enviar para o ramo "site" (o Vercel publica a partir daqui)
        run: |
          cd site
          git init -q -b site
          git config user.name "vinovim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site e downloads $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
