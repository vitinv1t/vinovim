name: Compilar vinovim (.apk e .exe)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nativo:
        description: 'Compilar também o .exe e o .apk'
        type: boolean
        default: true

concurrency:
  group: vinovim-build
  cancel-in-progress: true

jobs:
  # o .exe e o .apk só se compilam quando muda alguma coisa deles;
  # o resto da app chega às apps instaladas pelo site, que se atualiza sempre
  changes:
    name: O que mudou
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      native: ${{ steps.c.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        name: Ver se é preciso compilar as apps
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "native=${{ inputs.nativo }}" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(desktop/|mobile/|assets/|config/|scripts/|package\.json$|capacitor\.config\.json$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      # o .exe e o .apk passam de um passo para o outro pela versão "apps" do GitHub
      # (os artefactos têm uma quota de espaço que se esgota; as versões não)
      - name: Preparar a versão "apps"
        if: steps.c.outputs.native == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apps >/dev/null 2>&1 || gh release create apps --title "Apps do Vinovim" --notes "O instalador para Windows e a app para Android mais recentes. Também em https://vinovim.vercel.app/download"

  windows:
    name: Windows (.exe)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ficheiros e icones
        shell: bash
        run: |
          pip install pillow
          mkdir -p www electron
          cp -r app/. www/ && rm -f www/download.html
          cp version.json www/
          cp desktop/main.js desktop/preload.js config/remote.json electron/
          python scripts/make_icons.py
      - run: npm install
      - run: npx electron-builder --win --publish never
      - name: Guardar o instalador na versão "apps"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls dist/*.exe | head -n 1)" vinovim-setup.exe
          gh release upload apps vinovim-setup.exe --clobber

  android:
    name: Android (.apk)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ficheiros e icones
        run: |
          pip install pillow
          mkdir -p www electron
          cp -r app/. www/ && rm -f www/download.html
          cp version.json www/
          cp desktop/main.js desktop/preload.js config/remote.json electron/
          python scripts/make_icons.py
      - run: npm install
      - name: Ligar a app Android ao site (atualiza-se sozinha)
        run: node -e "const fs=require('fs');const c=require('./capacitor.config.json');const r=require('./config/remote.json');if(r.url){c.server=Object.assign({},c.server,{url:r.url,cleartext:false})}fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - name: Plugins nativos (widget, abrir links)
        run: npm install --no-save @capacitor/preferences@^6 @capacitor/app@^6
      - name: Plugin de voz (opcional)
        run: npm install --no-save @capacitor-community/speech-recognition@^6
        continue-on-error: true
      - run: npx cap add android
      - name: Icone e ecra de arranque
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0c0a12' --splashBackgroundColor '#0c0a12'
        continue-on-error: true
      - run: npx cap sync android
      - name: Widget Continuar a ver e microfone
        run: python mobile/android_widget.py
      - name: Atualizar dentro da app, versão e assinatura
        env:
          VINOVIM_ANDROID_KEY: ${{ secrets.VINOVIM_ANDROID_KEY }}
        run: python mobile/android_update.py
      - name: Suporte para Android TV (comando e launcher da TV)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i -E 's#(<category android:name="android.intent.category.LAUNCHER" ?/>)#\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />#' "$M"
          sed -i -E 's#<application#<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application android:banner="@drawable/tv_banner"#' "$M"
          mkdir -p android/app/src/main/res/drawable
          cp assets/tv-banner.png android/app/src/main/res/drawable/tv_banner.png
          grep -n "LEANBACK\|leanback\|banner" "$M"
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk vinovim.apk
      - name: Guardar a APK na versão "apps"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload apps vinovim.apk --clobber

  publish:
    name: Publicar no site (vinovim.vercel.app)
    needs: [changes, windows, android]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.windows.result != 'failure' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar o .exe e o .apk acabados de compilar
        if: needs.changes.outputs.native == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/vinovim-windows artifacts/vinovim-android
          gh release download apps -p vinovim-setup.exe -D artifacts/vinovim-windows --clobber
          gh release download apps -p vinovim.apk -D artifacts/vinovim-android --clobber
      - name: Usar o .exe e o .apk que já estão no site
        if: needs.changes.outputs.native != 'true'
        run: |
          git fetch -q --depth 1 origin site
          mkdir -p artifacts/vinovim-windows artifacts/vinovim-android
          git show FETCH_HEAD:public/downloads/vinovim-setup.exe > artifacts/vinovim-windows/vinovim-setup.exe
          git show FETCH_HEAD:public/downloads/vinovim.apk > artifacts/vinovim-android/vinovim.apk
      - name: Montar o site com os downloads
        run: |
          pip install pillow
          python scripts/make_icons.py
          mkdir -p site/public/downloads
          cp -r app/. site/public/
          cp version.json site/public/
          cp -r server/. site/
          cp -r www/icons site/public/icons
          cp "$(ls artifacts/vinovim-windows/*.exe | head -n 1)" site/public/downloads/vinovim-setup.exe
          cp artifacts/vinovim-android/vinovim.apk site/public/downloads/vinovim.apk
          python -c "import json,os;d='site/public/downloads';json.dump({f:os.path.getsize(os.path.join(d,f)) for f in os.listdir(d)},open('site/public/downloads.json','w'))"
          ls -la site/public site/public/downloads
      - name: Enviar para o ramo "site" (o Vercel publica a partir daqui)
        run: |
          cd site
          git init -q -b site
          git config user.name "vinovim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site e downloads $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
